  # Generic geostationary comsats, each for a bus family and every variant GCAT
  # gives it, its guesses included. DFH-4E is a larger design left out, and so are
  # three buses that hold more than comsats: DS-2000 carries Himawari,
  # which flies one wing, Ekspress-1000 GLONASS-K, and Ekspress-2000 cylindrical
  # bodies. A2100 also holds GPS III and GOES, whose own models win by NORAD id, and
  # MUOS, whose large reflectors the generic outline leaves out.
  # FS-1300, SSL-1300 and LS-1300 are one bus under Loral's, SSL's and Maxar's
  # names, but GCAT's FS-1300 holds GOES 8 to 12 and FS-1300O TerreStar 1 with its
  # 18 m reflector, so those two are left out.
  #
  # 0.1155 scales the 268-unit span to the 31 m of a standard SSL-1300. Flipped
  # so the feed tower and antenna deck face Earth; the arrays already run
  # north-south, across the velocity.
