# The recipe `pnpm build` turns into the models and models.yaml. Edit this file;
# models.yaml is written by the build.
#
# Each model is placed in the frame satvis draws a satellite in: glTF +Z along
# the velocity, +Y to the zenith, +X to port. `rotate` steps name those axes
# (velocity, port, zenith) and apply in order; `scale` converts to metres.
#
# A model's `file` is its path in public/, which satvis serves at /data/models/.
# It lists every satellite it depicts, by NORAD id, or names the GCAT buses whose
# satellites it depicts, or both; satvis maps those to the file. A NORAD id, and a
# bus, may appear under one model only. A bus is only named when nothing else in
# GCAT uses it, decayed objects included (`pnpm check-buses`), except by a generic
# model under generic/, which names a platform bus and shows only its outline. Files
# keep the name of their first satellite, or of the design they show.
#
# A source is fetched from `path`, or built by `generator` (generators/), named
# after its file in lower case.

sources:
  nasa:
    name: NASA 3D Resources
    url: https://github.com/nasa/NASA-3D-Resources
    commit: 11ebb4ee043715aefbba6aeec8a61746fad67fa7
    credit: NASA
    license: Not subject to US copyright. Credit NASA; NASA insignia and logos are not free to use, and use must not imply NASA endorsement.
  satvis:
    name: Generated by build.ts (generators/)
    credit: satvis
    license: MIT (LICENSE). Built from published dimensions, cited in each generator.

models:
  # NASA JSC's IGOAL model of the station as it flies in 2026: roll-out arrays (iROSA)
  # over wings 1A, 1B, 3A, 4A, 2B and 4B, Nauka with its robotic arm, Prichal, Bishop,
  # and no visiting vehicles. Its 2.7 million triangles and 67 MB of textures are cut
  # to size: the detail parts go, except the arrays' and radiators', the meshes are
  # joined and simplified within 0.05% of their extent, and textures shrink to 512 px,
  # the array atlases to 1024 px.
  #
  # The source is in inches under a 0.0025817 root scale, so 9.8386 restores metres:
  # truss segments S0 and P1 come out 13.4 m and 13.8 m and the legacy wings 35.2 m x
  # 11.4 m, against 13.4 m, 13.7 m and 35.05 m x 11.58 m (NASA). That root scale is
  # negative, which mirrors the station: Kibo sat to starboard. Mirrored back, it is
  # turned so the US segment leads and the arrays' truss runs port to starboard.
  #
  # Its materials blend wherever a texture has alpha; as cut-outs they draw solid. The
  # truss atlas's alpha only marks the gaps between its islands, and the outboard
  # radiator panels map onto such a gap, so the truss is drawn opaque: the colour
  # under the gap is the radiators' light grey. Each solar array blanket is two
  # coincident sheets, cells on one side and the backing on the other; drawn
  # double-sided they fight for the same pixels, so the arrays are single-sided.
  - file: ISS-(ZARYA).glb
    satellites:
      - { name: ISS (ZARYA), noradId: 25544 }
    source: { id: nasa, path: "3D Models/International Space Station (ISS) (D) (IGOAL)/International Space Station (ISS).glb" }
    removeNodesMatching: "^(?!.*(IROSA|Radiator)).*(Details|Handrail|HandRail|_Bag|Cover)"
    mirror: port
    rotate:
      - { axis: zenith, degrees: -90 }
    scale: 9.8386
    stripFallbackTextures: true
    join: true
    simplify: 0.0005
    textureSize: 512
    textureSizes: { Truss_Diffuse: 1024, IROSA_Diffuse: 1024 }
    matte: 0.1
    alphaMask: true
    opaqueMaterials: [Truss]
    singleSidedNodes: "Array|IROSA_Deployed"
    # The S1 and P1 heat-rejection radiators map onto the truss atlas's solar cells;
    # they are white panels with dark seams (NASA, iss072e316172).
    nodeColors: { "^(S1|P1)_Radiator$": [0.85, 0.85, 0.86] }
    # The source poses every wing facing along the truss, the port wings facing the
    # starboard ones, which never happens in orbit. Turned on their beta gimbals, all
    # wings show their cells, the dark side the roll-out arrays sit on
    # (iss065e125924), to the zenith, the blankets side by side along the truss: the
    # station at noon.
    turnNodes:
      - { node: PORT_BETA_ROT_2A, axis: z, degrees: -90 }
      - { node: PORT_BETA_ROT_4A, axis: z, degrees: 90 }
      - { node: PORT_BETA_ROT_2B, axis: z, degrees: 90 }
      - { node: PORT_BETA_ROT_4B, axis: z, degrees: -90 }
      - { node: STBD_BETA_ROT_1A, axis: z, degrees: -90 }
      - { node: STBD_BETA_ROT_3A, axis: z, degrees: 90 }
      - { node: STBD_BETA_ROT_1B, axis: z, degrees: 90 }
      - { node: STBD_BETA_ROT_3B, axis: z, degrees: -90 }

  # Landsat 9 is a near-copy (same LEOStar-3 bus, OLI-2 and TIRS-2), so it shares
  # the model. Already in metres: the array face is 9.77 m long against 32 ft
  # (9.75 m), and the array, canted 41°, spans 14.4 m along its axis.
  # OLI and TIRS sit on an optical bench at the forward end (USGS LSDS-1574), so
  # the cylindrical bus runs along the velocity. The array pointing away from
  # Earth, clear of the instruments, is inferred, not documented.
  - file: LANDSAT-8.glb
    satellites:
      - { name: LANDSAT 8, noradId: 39084 }
      - { name: LANDSAT 9, noradId: 49260 }
    source: { id: nasa, path: "3D Models/Landsat 8/Landsat 8.glb" }
    rotate:
      - { axis: zenith, degrees: -90 }
      - { axis: velocity, degrees: 180 }

  # 0.919 brings the 5.53 m span to the documented 5.08 m (eoPortal). The white box
  # is the Cloud Profiling Radar's 1.85 m antenna, facing nadir, and the ring end
  # points away from the Earth (JPL, PIA03012); turned about the zenith so the cells
  # face the zenith on the sunlit port side of the 13:30 orbit. NASA decommissioned
  # CloudSat in March 2024; it is still in orbit but no longer in the catalog.
  - file: CLOUDSAT.glb
    satellites:
      - { name: CLOUDSAT, noradId: 29107 }
    source: { id: nasa, path: "3D Models/CloudSat (C)/CloudSat (C).glb" }
    rotate:
      - { axis: zenith, degrees: 180 }
    scale: 0.919
    stripFallbackTextures: true

  # Already in metres. The ATLAS telescope looks out of the dark 0.8 m aperture
  # (the source's "Atlas scope"), which faced starboard; it looks at nadir, with the
  # array a flat wing across the track to port and the radiator to starboard, as
  # NASA's artist impression and Luthcke et al. 2021 (NTRS 20210026104: "airplane
  # mode" below 45° beta) show; the launch-adapter dome trails.
  - file: ICESAT-2.glb
    satellites:
      - { name: ICESAT-2, noradId: 43613 }
    source: { id: nasa, path: "3D Models/Ice, Clouds, and Land Elevation Satellite-2 (ICESat-2) (B)/Ice, Clouds, and Land Elevation Satellite-2 (ICESat-2) (B).glb" }
    rotate:
      - { axis: velocity, degrees: 180 }
      - { axis: zenith, degrees: 90 }
    stripFallbackTextures: true

  # A GRACE model: GRACE-FO reused its design. 0.404 scales the 7.73-unit body to
  # the 3.123 m length. The ranging horns point at each other: GRACE-FO 1 leads and
  # flies backwards, "with a 180° yaw bias" (Cossavella et al. 2022; GRACE-FO Level-1
  # handbook), and GRACE-FO 2 trails, horn first, as the source is oriented; the GPS
  # antenna faces the zenith. The source's underside takes a normal map as its
  # colour, which draws it magenta; it is Teflon film (handbook), drawn silver.
  - file: GRACE-FO-1.glb
    satellites:
      - { name: GRACE-FO 1, noradId: 43476 }
    source: { id: nasa, path: "3D Models/Gravity Recovery and Climate Experiment (GRACE) (B)/Gravity Recovery and Climate Experiment (GRACE) (B).glb" }
    rotate:
      - { axis: zenith, degrees: 180 }
    scale: 0.404
    stripFallbackTextures: true
    baseColors: { underside.001: [0.75, 0.76, 0.78] }

  - file: GRACE-FO-2.glb
    satellites:
      - { name: GRACE-FO 2, noradId: 43477 }
    source: { id: nasa, path: "3D Models/Gravity Recovery and Climate Experiment (GRACE) (B)/Gravity Recovery and Climate Experiment (GRACE) (B).glb" }
    scale: 0.404
    stripFallbackTextures: true
    baseColors: { underside.001: [0.75, 0.76, 0.78] }

  # NOAA 20 shares Suomi NPP's BCP-2000 bus and instruments. NOAA 21 is on a
  # different bus (LEOStar-3) and only stands in. Already in metres: the bus is
  # 4.2 m long, as published (eoPortal). The 1.3 m end cannot carry five
  # instruments, so the long axis runs along the track and the instrument deck
  # faces nadir. The single wing turns once per orbit, so it extends across the
  # track, on the anti-sun side (eoPortal): starboard, as the 13:30 ascending
  # node keeps the sun to port.
  - file: SUOMI-NPP.glb
    satellites:
      - { name: SUOMI NPP, noradId: 37849 }
      - { name: NOAA 20 (JPSS-1), noradId: 43013 }
      - { name: NOAA 21 (JPSS-2), noradId: 54234 }
    source: { id: nasa, path: "3D Models/Suomi National Polar-orbiting Partnership (Suomi NPP)/Suomi National Polar-orbiting Partnership (Suomi NPP).glb" }
    rotate:
      - { axis: velocity, degrees: 90 }
      - { axis: zenith, degrees: -90 }
    stripFallbackTextures: true

  # The GOES-R series: one wing with the sun-pointing platform on its yoke, and the
  # magnetometer boom. 83 scales the 0.096-unit boom to its 8 m (NASA GSFC, "An
  # Overview of the Design and Development of the GOES R-Series Space Segment").
  # Flipped so the instrument deck faces Earth and the apogee-engine deck faces
  # away. The wing runs north-south; the satellites yaw-flip (NOAA's GOES-R
  # spacecraft page), so it is on either side in turn.
  - file: GOES-16.glb
    satellites:
      - { name: GOES 16, noradId: 41866 }
      - { name: GOES 17, noradId: 43226 }
      - { name: GOES 18, noradId: 51850 }
      - { name: GOES 19, noradId: 60133 }
    source: { id: nasa, path: "3D Models/Geostationary Operational Environmental Satellites/Geostationary Operational Environmental Satellites.glb" }
    rotate:
      - { axis: velocity, degrees: 180 }
    scale: 83

  # CYGFM06 reentered in 2024. 1.05 brings the 1.59 m span to the published
  # 1.67 m (eoPortal). Turned so the patch antennas face nadir and the arrays,
  # fixed across the track, face the zenith.
  - file: CYGFM01.glb
    satellites:
      - { name: CYGFM01, noradId: 41887 }
      - { name: CYGFM02, noradId: 41886 }
      - { name: CYGFM03, noradId: 41891 }
      - { name: CYGFM04, noradId: 41885 }
      - { name: CYGFM05, noradId: 41884 }
      - { name: CYGFM07, noradId: 41890 }
      - { name: CYGFM08, noradId: 41888 }
    source: { id: nasa, path: "3D Models/Cyclone Global Navigation Satellite System (CYGNSS)/Cyclone Global Navigation Satellite System (CYGNSS).glb" }
    rotate:
      - { axis: port, degrees: 90 }
    scale: 1.05
    stripFallbackTextures: true

  # The first generation, built by TRW; TDRS 1 and 4 are retired. Already in
  # metres: the dishes measure 5.1 m against 4.9 m and span 13.1 m against 13.4 m,
  # though the arrays reach 21 m against a published 17.4 m. Flipped so the
  # single-access dishes face Earth, where the satellites they relay fly; the
  # arrays already run north-south.
  - file: TDRS-3.glb
    satellites:
      - { name: TDRS 3, noradId: 19548 }
      - { name: TDRS 5, noradId: 21639 }
      - { name: TDRS 6, noradId: 22314 }
      - { name: TDRS 7, noradId: 23613 }
    source: { id: nasa, path: "3D Models/Tracking and Data Relay Satellites (TDRS) (B)/Tracking and Data Relay Satellites (TDRS) (B).glb" }
    rotate:
      - { axis: velocity, degrees: 180 }
    stripFallbackTextures: true

  # The Boeing 601 generations with springback dishes; TDRS 9 and 10 are retired.
  # 0.2234 scales the 94.4-unit span to TDRS 11's 21.1 m, which leaves the dishes
  # 6.5 m across against 4.6 m. Flipped like the first generation.
  - file: TDRS-8.glb
    satellites:
      - { name: TDRS 8, noradId: 26388 }
      - { name: TDRS 11, noradId: 39070 }
      - { name: TDRS 12, noradId: 39504 }
      - { name: TDRS 13, noradId: 42915 }
    source: { id: nasa, path: "3D Models/Tracking and Data Relay Satellites (TRDS) (E)/Tracking and Data Relay Satellites (TRDS) (E).glb" }
    rotate:
      - { axis: velocity, degrees: 180 }
    scale: 0.2234

  # The source's two textures are .tga files outside the GLB that the NASA repo
  # does not have, so the build must drop them; the panels keep their base colours.
  # 0.0005 scales the 13,622-unit bus to its 6.8 m (eoPortal), which makes the wing
  # 8.4 m x 5.0 m against 9 m x 5 m. The instrument boxes face nadir and the HGA
  # mast the zenith; the wing deploys on the sunlit side (eoPortal), port in the
  # morning descending orbit (about 09:00 since Terra left the constellation in 2022),
  # which brings the HGA end to the front.
  - file: TERRA.glb
    satellites:
      - { name: TERRA, noradId: 25994 }
    source: { id: nasa, path: "3D Models/Terra/Terra.glb" }
    rotate:
      - { axis: zenith, degrees: 90 }
    scale: 0.0005
    dropExternalTextures: true

  # 0.911 brings the 18.7 m span to the published 17.03 m (eoPortal), leaving the
  # bus 7.4 m long against 6.85 m. MLS sits on the front and the other three
  # instruments on the nadir side (NASA); radiators take the anti-sun side, so the
  # wing is on the sunlit side: port, in the afternoon ascending orbit (13:45 at
  # launch, about 15:00 by 2026 as Aura drifts). The three
  # agree: the instrument face goes to nadir, the wing to port, and that puts the
  # MLS antenna end in front.
  - file: AURA.glb
    satellites:
      - { name: AURA, noradId: 28376 }
    source: { id: nasa, path: "3D Models/Aura (B)/Aura (B).glb" }
    rotate:
      - { axis: zenith, degrees: -90 }
      - { axis: velocity, degrees: 90 }
    scale: 0.911
    stripFallbackTextures: true

  # Already in metres: 13.78 m long and 19.51 m across the arrays, against 13.8 m
  # and 19.5 m (NASA). The attitude is inertial; the aperture leads and the
  # arrays run port to starboard.
  - file: CXO.glb
    satellites:
      - { name: CXO, noradId: 25867 }
    source: { id: nasa, path: "3D Models/Chandra X-ray Observatory/Chandra X-ray Observatory.glb" }
    rotate:
      - { axis: zenith, degrees: 90 }
    stripFallbackTextures: true

  # 0.24 scales the 62.3-unit array span to the 15 m deployed width (NASA SVS),
  # which leaves the LAT 1.6 m across against 1.8 m. Already oriented: the LAT
  # faces the zenith, as in the sky survey, which rocks it 50 degrees north and
  # south of zenith and yaws to keep the sun on the arrays, so the arrays, drawn
  # along the track, could run any way in the horizontal.
  - file: FGRST-(GLAST).glb
    satellites:
      - { name: FGRST (GLAST), noradId: 33053 }
    source: { id: nasa, path: "3D Models/Fermi Gamma-ray Large Area Space Telescope/Fermi Gamma-ray Large Area Space Telescope.glb" }
    scale: 0.24

  # Of the two TESS models, the one with the high-gain antenna and the array cells;
  # (A) has a gold sunshade and blank arrays. 0.527 scales the 7.39-unit span to
  # 3.9 m (eoPortal), which makes the HGA 0.63 m against 0.7 m. Its silver foil and
  # reflector take normal maps as their colour, which draws them lavender; they are
  # grey in NASA's render (svs.gsfc.nasa.gov/12843). The attitude is inertial, the
  # cameras on a sky sector; they face the zenith.
  - file: TESS.glb
    satellites:
      - { name: TESS, noradId: 43435 }
    source: { id: nasa, path: "3D Models/Transiting Exoplanet Survey Satellite (TESS) (B)/Transiting Exoplanet Survey Satellite (TESS) (B).glb" }
    scale: 0.527
    stripFallbackTextures: true
    baseColors: { foil_silver: [0.45, 0.46, 0.48], reflector: [0.55, 0.55, 0.57] }

  # 0.1355 scales the 39.9-unit span to the 17.75 ft (5.41 m) width (NASA), which
  # makes the bus 1.8 m across against the 1.7 m diameter; the published 18.5 ft
  # height comes out 4.0 m. The attitude is inertial; BAT, XRT and UVOT face the
  # zenith.
  - file: SWIFT.glb
    satellites:
      - { name: SWIFT, noradId: 28485 }
    source: { id: nasa, path: "3D Models/Swift/Swift.glb" }
    scale: 0.1355

  # 0.026 scales the KuPR to its 2.5 m x 2.4 m (NEC, JAXA) and the GMI reflector to
  # 1.2 m; the observatory is 11.2 m x 7.0 m x 4.9 m against 13 m x 6.5 m x 5 m
  # (eoPortal). The DPR already faces nadir and the GMI the zenith. The GMI scans
  # a sector about the ground track past its end of the bus, so that end leads;
  # GPM yaws 180 degrees every 40 days, so half the time it trails.
  - file: GPM-CORE.glb
    satellites:
      - { name: GPM-CORE, noradId: 39574 }
    source: { id: nasa, path: "3D Models/Global Precipitation Measurement/Global Precipitation Measurement.glb" }
    rotate:
      - { axis: zenith, degrees: -90 }
    scale: 0.026

  # 0.163 scales the 13.04-unit column to its 2.12 m (eoPortal), leaving each wing
  # 2.2 m against about 3 m. The arrays rotate about the pitch axis (eoPortal,
  # OCO), so they run port to starboard. The column flies horizontal, along the
  # track, its telescope looking out of a side face at nadir (JPL's 2014 launch press
  # kit, p. 27; JPL's in-orbit render); which side and which end lead are not
  # published. Turned so, the panels face 45° between nadir and the track, a pose
  # their single axis allows. The source's gold comes from the SeaStar and PARASOL models it
  # reuses; OCO-2 is silver and black (JPL's clean-room photo).
  - file: OCO-2.glb
    satellites:
      - { name: OCO 2, noradId: 40059 }
    source: { id: nasa, path: "3D Models/Orbiting Carbon Observatory (OCO) 2/Orbiting Carbon Observatory (OCO) 2.glb" }
    rotate:
      - { axis: velocity, degrees: 180 }
      - { axis: zenith, degrees: 90 }
      - { axis: port, degrees: 90 }
    scale: 0.163
    baseColors:
      Parasol-Bronze-sm: [0.1, 0.1, 0.11]
      Parasol-Gold-fl: [0.72, 0.72, 0.74]
      Parasol-Gold-sm: [0.72, 0.72, 0.74]
      SEA-Bottom Disk: [0.72, 0.72, 0.74]
      SEA-SeaWiffsFoil: [0.72, 0.72, 0.74]
      SEA-SidesBorder: [0.1, 0.1, 0.11]
      SEA-SidesGoldFoil: [0.72, 0.72, 0.74]
      SEA-SidesGoldFoil-sm: [0.72, 0.72, 0.74]
      SEA-SolarPanels-edges: [0.72, 0.72, 0.74]
      SEA-TopnBott: [0.72, 0.72, 0.74]

  # 0.169 scales the 37-unit array span to 6.25 m (NASA), which makes it 4.75 m
  # along the sun axis against 4.5 m. The attitude is inertial, the instruments
  # on the sun; they face the zenith.
  - file: SDO.glb
    satellites:
      - { name: SDO, noradId: 36395 }
    source: { id: nasa, path: "3D Models/Solar Dynamics Observatory/Solar Dynamics Observatory.glb" }
    scale: 0.169

  # Sentinel-6B is a copy. Already in metres: 5.13 m x 4.37 m x 2.32 m against
  # 5.13 m x 4.17 m x 2.34 m (ESA). The Poseidon-4 dish and the retroreflector
  # already face nadir. The long axis runs along the track, the GNSS-RO antennas
  # looking fore and aft, and the AMR-C end is "the front of the spacecraft" (NASA,
  # PIA24106); the satellite yaw-flips.
  - file: SENTINEL-6A.glb
    satellites:
      - { name: SENTINEL-6A, noradId: 46984 }
      - { name: SENTINEL-6B, noradId: 66514 }
    source: { id: nasa, path: "3D Models/Jason Continuity of Service (Sentinel-6)/Jason Continuity of Service (Sentinel-6).glb" }
    rotate:
      - { axis: zenith, degrees: -90 }
    stripFallbackTextures: true

  # A Jason-2 model: Jason-3 shares its Proteus bus and payload. 3.75 scales the
  # 0.255-unit platform to its 954 mm (Proteus spec), which makes the satellite 3.7 m x
  # 2.0 m, as published, and the span 8.4 m against 10 m. The Poseidon dish, with
  # its feed tripod, and the DORIS antenna face up in the source; they look at
  # nadir. The arrays rotate across the track. The payload end leads; Jason-3
  # yaw-flips. The body's foil texture has no coordinates in the source, which drew
  # it white; it takes the source's own gold, as NASA's photos show it.
  - file: JASON-3.glb
    satellites:
      - { name: JASON-3, noradId: 41240 }
    source: { id: nasa, path: "3D Models/Ocean Surface Topography Mission (OSTM Jason-2)/Ocean Surface Topography Mission (OSTM Jason-2).glb" }
    rotate:
      - { axis: velocity, degrees: 180 }
      - { axis: zenith, degrees: 90 }
    scale: 3.75
    stripFallbackTextures: true
    baseColors: { Foil: [0.46, 0.29, 0.0] }

  # Of the two MMS models, the one with materials. 1.99 scales the 1.76-unit deck
  # to 3.5 m (NASA); the 60 m wire booms stop at 14 m, and the axial booms at 8 m of
  # their 15 m (Ergun et al. 2016: 12.67 m and a 2.25 m whip a side). The spacecraft
  # spin, axis near the ecliptic normal; the spin axis faces the zenith.
  - file: MMS-1.glb
    satellites:
      - { name: MMS 1, noradId: 40482 }
      - { name: MMS 2, noradId: 40483 }
      - { name: MMS 3, noradId: 40484 }
      - { name: MMS 4, noradId: 40485 }
    source: { id: nasa, path: "3D Models/Magnetospheric Multiscale (MMS) (B)/Magnetospheric Multiscale (MMS) (B).glb" }
    scale: 1.99

  # THEMIS B and C became ARTEMIS, at the Moon. Already in metres: the bus is
  # 0.85 m x 0.84 m x 0.49 m against 84 cm x 84 cm x 51 cm (eoPortal), and the axial
  # booms 7.2 m against 6.9 m (Bonnell et al. 2008), but the spin-plane wire booms
  # stop at 3 m a side of their 50 m and 40 m. The probes spin; the spin axis faces
  # the zenith.
  - file: THEMIS-A.glb
    satellites:
      - { name: THEMIS A, noradId: 30580 }
      - { name: THEMIS D, noradId: 30797 }
      - { name: THEMIS E, noradId: 30798 }
    source: { id: nasa, path: "3D Models/Time History of Events and Macroscale Interactions During Substorms (THEMIS)/Time History of Events and Macroscale Interactions During Substorms (THEMIS).glb" }
    stripFallbackTextures: true

  # 0.0436 scales the 229.6-unit span to 10 m (JAXA), which also gives the bus its
  # 1.6 m; only the source's telescope column is short, 2.3 m against 4 m. Hinode
  # points SOT and the arrays at the sun, which the 18:45 dawn-dusk orbit keeps near the orbit
  # normal: port. The array runs along the track.
  - file: HINODE-(SOLAR-B).glb
    satellites:
      - { name: HINODE (SOLAR-B), noradId: 29479 }
    source: { id: nasa, path: "3D Models/Hinode (Solar-B)/Hinode (Solar-B).glb" }
    rotate:
      - { axis: velocity, degrees: -90 }
      - { axis: port, degrees: -90 }
    scale: 0.0436

  # China's space station, generated from published dimensions and CMSA's photos
  # (generators/tiangong.ts). The whole station is drawn on Tianhe's record; Wentian
  # and Mengtian keep their own catalog records and get no model, as Nauka on the ISS.
  - file: CSS-(TIANHE).glb
    satellites:
      - { name: CSS (TIANHE), noradId: 48274 }
    source: { id: satvis, generator: css-(tianhe) }

