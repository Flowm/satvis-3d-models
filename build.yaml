    role: Generic geostationary communications satellite (Eurostar 3000 bus)
    buses: [Eurostar 3000, Eurostar 3000e, Eurostar 3000EOR, Eurostar 3000GM, Eurostar 3000LS, Eurostar 3000LX, Eurostar 3000LXH, Eurostar 3000M, Eurostar 3000S, Eurostar 3000X]
    source: { id: satvis, generator: eurostar-3000 }

